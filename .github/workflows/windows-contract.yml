name: Windows Sync Contract

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "sync_contract.py"
      - "sync_v2_store.py"
      - "sync_manager.py"
      - "tests/**"
      - "requirements-stage8.txt"
      - "Antigravity_AI_Writer.spec"
      - ".github/workflows/windows-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Contract vectors, Windows tests, and executable
    runs-on: windows-latest
    env:
      EXPECTED_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      WRITERPAD_SYNC_CONTRACT_DIR: ${{ github.workspace }}/contract-source/sync-contract
    steps:
      - name: Check out exact Windows client head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_CHECKOUT_SHA }}
          persist-credentials: false

      - name: Check out pinned released contract content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChocoS-yrup/Writerpad
          ref: 7bcb5d25c5376b02469666df7318b90b456ffee6
          path: contract-source
          persist-credentials: false

      - name: Confirm exact Windows client checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "Expected HEAD: $env:EXPECTED_CHECKOUT_SHA"
          Write-Host "Actual HEAD:   $actual"
          if ($actual -ne $env:EXPECTED_CHECKOUT_SHA) { exit 1 }

      - name: Set up contract validator Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contract-source/sync-contract/requirements-validation.txt

      - name: Validate pinned released contract
        run: |
          python -m pip install -r contract-source/sync-contract/requirements-validation.txt
          python contract-source/sync-contract/scripts/verify_contract.py

      - name: Set up Windows client Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements-stage8.txt

      - name: Install pinned Windows dependencies
        run: python -m pip install -r requirements-stage8.txt

      - name: Install ProcDump exception monitor
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:RUNNER_TEMP "writerpad-crash-dumps"
          New-Item -ItemType Directory -Path $dumpDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP "procdump.zip"
          $toolsDir = Join-Path $env:RUNNER_TEMP "procdump"
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $toolsDir -Force
          $procdump = Join-Path $toolsDir "procdump64.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $procdump
          if ($signature.Status -ne "Valid" -or
              $signature.SignerCertificate.Subject -notlike "*Microsoft*") {
            throw "ProcDump signature is not valid Microsoft code"
          }
          "PROCDUMP_PATH=$procdump" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WRITERPAD_DUMP_DIR=$dumpDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run Windows client tests under ProcDump exception monitor
        id: windows_tests
        continue-on-error: true
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          # This is the last diagnostic fallback. Unlike the passive attempts,
          # ProcDump attaches as an exception monitor and may change timing.
          & $env:PROCDUMP_PATH -accepteula -ma -e -x $env:WRITERPAD_DUMP_DIR $python -X faulthandler -m unittest discover -s tests -v
          $monitorExitCode = $LASTEXITCODE
          $dumps = @(Get-ChildItem -LiteralPath $env:WRITERPAD_DUMP_DIR -Filter "*.dmp" -File -ErrorAction SilentlyContinue)
          "WRITERPAD_TEST_EXIT_CODE=$monitorExitCode" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ProcDump monitor exit code: $monitorExitCode"
          Write-Host "ProcDump immediate dump count: $($dumps.Count)"
          if ($dumps.Count -gt 0) { exit 1 }
          exit $monitorExitCode

      - name: Install debugger after the uninstrumented failure
        if: steps.windows_tests.outcome == 'failure'
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          if (-not (Test-Path -LiteralPath $cdb)) {
            $installer = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
            Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2272610" -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne "Valid" -or
                $signature.SignerCertificate.Subject -notlike "*Microsoft*") {
              throw "Windows SDK installer signature is not valid Microsoft code"
            }
            $install = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
              "/features", "OptionId.WindowsDesktopDebuggers", "/quiet", "/norestart"
            )
            if ($install.ExitCode -ne 0) {
              throw "Windows debugger installation failed: $($install.ExitCode)"
            }
          }
          if (-not (Test-Path -LiteralPath $cdb)) {
            throw "cdb.exe was not installed"
          }
          "CDB_PATH=$cdb" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Analyze ProcDump exception dump
        if: steps.windows_tests.outcome == 'failure'
        shell: pwsh
        run: |
          # Poll briefly so ProcDump filesystem visibility cannot race.
          $dumps = @()
          for ($poll = 0; $poll -lt 15; $poll++) {
            $dumps = @(Get-ChildItem -LiteralPath $env:WRITERPAD_DUMP_DIR -Filter "*.dmp" -File -ErrorAction SilentlyContinue)
            if ($dumps.Count -gt 0) { break }
            Start-Sleep -Seconds 2
          }
          Write-Host "Uninstrumented test exit code: $env:WRITERPAD_TEST_EXIT_CODE"
          Write-Host "ProcDump exception dump count: $($dumps.Count)"
          if ($dumps.Count -eq 0) {
            throw "The ProcDump-monitored test failed but produced no crash dump"
          }
          $commands = @(
            ".echo ===== WER CRASH DUMP ====="
            ".lastevent"
            ".ecxr"
            "!analyze -v"
            "~* kv 100"
            "lm"
            "q"
          ) -join ";"
          foreach ($dump in $dumps) {
            Write-Host "Analyzing $($dump.FullName) ($($dump.Length) bytes)"
            & $env:CDB_PATH -y "srv*$env:RUNNER_TEMP\symbols*https://msdl.microsoft.com/download/symbols" -c $commands -z $dump.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "CDB failed to analyze $($dump.FullName): $LASTEXITCODE"
            }
          }
          throw "Original uninstrumented Windows tests failed; native dump analysis is above"

      - name: Build distributable executable
        if: steps.windows_tests.outcome == 'success'
        run: python -m PyInstaller --noconfirm --clean Antigravity_AI_Writer.spec

      - name: Record executable digest
        if: steps.windows_tests.outcome == 'success'
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath dist/Antigravity_AI_Writer.exe
          $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "executable=$($artifact.FullName)"
          Write-Host "bytes=$($artifact.Length)"
          Write-Host "sha256=$digest"
