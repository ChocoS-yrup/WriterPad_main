name: Windows Sync Contract

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "tests/**"
      - "requirements-stage8.txt"
      - "sync-contract/**"
      - "writerpad-recovery.cmd"
      - "작가님힘내세요.spec"
      - "style.qss"
      - "app_icon.ico"
      - "model_catalog.json"
      - ".github/workflows/windows-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Contract vectors, Windows tests, and executable
    runs-on: windows-latest
    env:
      EXPECTED_CHECKOUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      ANTIGRAVITY_APP_DATA_DIR: ${{ github.workspace }}/scratch/ci-app-data
      WRITERPAD_CONTRACT_REVIEW_UI: "0"
      WRITERPAD_SYNC_CONTRACT_DIR: ${{ github.workspace }}/contract-source/sync-contract
    steps:
      - name: Preserve released contract bytes on Windows
        # The released 0.3 commit predates its Windows checkout attributes.
        # Preserve Git blob bytes before either checkout; never rewrite assets
        # or relax their canonical digest/CR-byte checks after checkout.
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out exact Windows client head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_CHECKOUT_SHA }}
          persist-credentials: false

      - name: Check out pinned released contract content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChocoS-yrup/Writerpad
          ref: 3843b05aa91461e1541f5ebaa14557dc3dc2b39c
          path: contract-source
          persist-credentials: false

      - name: Confirm exact Windows client checkout
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          Write-Host "Expected HEAD: $env:EXPECTED_CHECKOUT_SHA"
          Write-Host "Actual HEAD:   $actual"
          if ($actual -ne $env:EXPECTED_CHECKOUT_SHA) { exit 1 }

      - name: Set up Python for validation, client tests, and packaging
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            contract-source/sync-contract/requirements-validation.txt
            requirements-stage8.txt

      - name: Validate pinned released contract
        run: |
          python -m pip install -r contract-source/sync-contract/requirements-validation.txt
          python contract-source/sync-contract/scripts/verify_contract.py

      - name: Install pinned Windows dependencies
        run: python -m pip install -r requirements-stage8.txt

      - name: Verify interpreter, dependencies, and storage-name-v2
        run: python scripts/verify_python314_runtime.py --require-python 3.14.7

      - name: Run Windows client tests
        # The hosted runner was still progressing at 20 minutes (1,052 tests
        # passed). Keep room for the full suite while bounding each stalled test.
        timeout-minutes: 45
        # A stalled test dumps all Python thread stacks after 120s; the
        # 720-save SQLite stress case has a 240s bound on busy runners.
        # The wrapper also resolves hosted Windows TEMP aliases for fixtures.
        run: python -u -X faulthandler scripts/run_windows_tests.py

      - name: Build distributable executable
        run: python -m PyInstaller --noconfirm --clean "작가님힘내세요.spec"

      - name: Check packaged Qt startup without opening projects
        timeout-minutes: 2
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath 'dist/작가님 힘내세요.exe'
          $smoke = Start-Process -FilePath $artifact.FullName -ArgumentList '--qt-import-smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw "Packaged Qt startup failed: $($smoke.ExitCode)" }

      - name: Check packaged Python and AI provider imports
        timeout-minutes: 2
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath 'dist/작가님 힘내세요.exe'
          $reportPath = Join-Path $env:RUNNER_TEMP 'packaged-runtime.json'
          $process = Start-Process -FilePath $artifact.FullName -ArgumentList '--runtime-report' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $reportPath
          if ($process.ExitCode -ne 0) { throw "Packaged imports failed: $($process.ExitCode)" }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.python -ne '3.14.7' -or $report.frozen -ne $true -or $report.verdict -ne 'ok') {
            throw "Unexpected packaged Python or incomplete dependencies"
          }
          Get-Content -LiteralPath $reportPath

      - name: Record executable digest
        shell: pwsh
        run: |
          $artifact = Get-Item -LiteralPath 'dist/작가님 힘내세요.exe'
          $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "executable=$($artifact.FullName)"
          Write-Host "bytes=$($artifact.Length)"
          Write-Host "sha256=$digest"
